<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .joke-box {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joke-text {
            color: #333;
            font-size: 1.1em;
            line-height: 1.6;
            text-align: center;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: bold;
        }

        .punchline {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            color: #555;
            font-style: italic;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .category-selector {
            margin-bottom: 20px;
        }

        .category-selector label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .category-selector select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
        }

        .error {
            color: #e74c3c;
            text-align: center;
            padding: 15px;
            background: #fadbd8;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random laugh!</p>

        <div class="category-selector">
            <label for="category">Select Category:</label>
            <select id="category">
                <option value="any">Any</option>
                <option value="general">General</option>
                <option value="programming">Programming</option>
                <option value="knock-knock">Knock-Knock</option>
            </select>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="joke-box">
            <div class="joke-text" id="joke">Click the button below to get a joke!</div>
        </div>

        <button id="getJokeBtn" onclick="getJoke()">Get Joke</button>
        <button onclick="copyJoke()">Copy Joke</button>

        <div class="footer">
            Powered by <a href="https://jokeapi.dev/" target="_blank">JokeAPI</a>
        </div>
    </div>

    <script>
        let currentJoke = '';

        async function getJoke() {
            const btn = document.getElementById('getJokeBtn');
            const jokeBox = document.getElementById('joke');
            const errorBox = document.getElementById('error');
            const category = document.getElementById('category').value;

            btn.disabled = true;
            jokeBox.innerHTML = '<div class="loading">Loading joke...</div>';
            errorBox.style.display = 'none';

            try {
                const url = category === 'any'
                    ? 'https://v2.jokeapi.dev/joke/Any'
                    : `https://v2.jokeapi.dev/joke/${category}`;

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();

                if (data.error) {
                    throw new Error('Could not get a joke. Try again!');
                }

                if (data.type === 'single') {
                    currentJoke = data.joke;
                    jokeBox.innerHTML = `<div class="joke-text">${escapeHtml(data.joke)}</div>`;
                } else {
                    currentJoke = `${data.setup}\n\n${data.delivery}`;
                    jokeBox.innerHTML = `
                        <div class="joke-text">
                            ${escapeHtml(data.setup)}
                            <div class="punchline">${escapeHtml(data.delivery)}</div>
                        </div>
                    `;
                }
            } catch (error) {
                errorBox.textContent = `Error: ${error.message}`;
                errorBox.style.display = 'block';
                jokeBox.innerHTML = '<div class="joke-text">Unable to load joke. Please try again!</div>';
            } finally {
                btn.disabled = false;
            }
        }

        function copyJoke() {
            if (!currentJoke) {
                alert('No joke to copy! Get a joke first.');
                return;
            }

            navigator.clipboard.writeText(currentJoke).then(() => {
                alert('Joke copied to clipboard!');
            }).catch(() => {
                alert('Failed to copy joke.');
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load a joke on page load
        window.addEventListener('load', getJoke);
    </script>
</body>
</html>
